name: Keep worker awake

# Pings the Render free-tier worker so it does not sleep, and checks the
# Vercel app without failing the job. No secrets. GitHub disables this
# schedule after 60 days without repository activity; run it by hand or
# push a commit to turn it back on.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping worker and web health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render worker
        run: curl -fsS --retry 5 --retry-delay 20 --max-time 60 https://openreply-worker-m510.onrender.com/healthz

      - name: Check Vercel health
        run: curl -fsS --retry 5 --retry-delay 20 --max-time 60 https://openreply-orcin-mu.vercel.app/api/health || true
